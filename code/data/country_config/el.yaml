# Country configuration: Greece (EL)
# =====================================
# All Greece-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/greece/classification_methodology.md.
#
# Schema version: 1.
#
# Greece is a DIRECT TABULA country -- the Greek residential typology was
# produced by NOA / NTUA / CRES. No proxy, no climate correction. Build
# group 3 (ES + PT, EL, CY).
#
# NOTE on ISO2 code: this model uses EL (the Eurostat convention) for Greece,
# not GR. EUBUCCO v0.2 uses Eurostat NUTS, so EL is the correct code.

country_code: EL
country_name: Greece

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions by NUTS2 (NUTS 2016). Greece has 13 NUTS2 regions.
eubucco:
  version: v0.2
  nuts2_partitions:
    - EL30   # Attiki (Attica)
    - EL41   # Voreio Aigaio (North Aegean)
    - EL42   # Notio Aigaio (South Aegean)
    - EL43   # Kriti (Crete)
    - EL51   # Anatoliki Makedonia, Thraki
    - EL52   # Kentriki Makedonia
    - EL53   # Dytiki Makedonia
    - EL54   # Ipeiros (Epirus)
    - EL61   # Thessalia
    - EL62   # Ionia Nisia
    - EL63   # Dytiki Ellada
    - EL64   # Sterea Ellada
    - EL65   # Peloponnisos
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  license: ODbL v1.0

