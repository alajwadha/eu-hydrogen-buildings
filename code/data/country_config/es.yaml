# Country configuration: Spain (ES)
# ====================================
# All Spain-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/spain/classification_methodology.md.
#
# Schema version: 1.
#
# Spain is a DIRECT TABULA country -- the Spanish residential typology was
# produced by CIEMAT (with IVE-Valencia, IETcc). No proxy, no climate
# correction (climate_multiplier = 1.0). Spain is the heavyweight of build
# group 3 (ES + PT, EL, CY) and is also used as the proxy for Portugal.

country_code: ES
country_name: Spain

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions by NUTS2 (NUTS 2016). Spain has 19 NUTS2 regions
# (17 autonomous communities + Ceuta + Melilla autonomous cities; Canarias
# is its own NUTS2 ES70).
eubucco:
  version: v0.2
  nuts2_partitions:
    - ES11   # Galicia
    - ES12   # Asturias
    - ES13   # Cantabria
    - ES21   # Pais Vasco
    - ES22   # Navarra
    - ES23   # La Rioja
    - ES24   # Aragon
    - ES30   # Madrid
    - ES41   # Castilla y Leon
    - ES42   # Castilla-La Mancha
    - ES43   # Extremadura
    - ES51   # Cataluna
    - ES52   # Comunidad Valenciana
    - ES53   # Illes Balears
    - ES61   # Andalucia
    - ES62   # Murcia
    - ES63   # Ceuta
    - ES64   # Melilla
    - ES70   # Canarias
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  license: ODbL v1.0
  # EUBUCCO area-correction factor (applied 2026-05-20).
  # The first G3 Colab rebuild (commit 86863d9) landed at 272.93 TWh vs
  # Hotmaps 173.59 = +57.2 pct INV. The deflator delivered the projected
  # ~150 TWh reduction; the remaining gap is the EUBUCCO floor-area over-
  # count documented in the audit doc (Correction 3, ES detailed entry).
  #
  # Our EUBUCCO ES residential heated-area total is 4,082 Mm^2 (per the
  # G3 reconciliation table); INE Censos 2021 anchors Spanish residential
  # floor area at ~2,500 Mm^2 total (18.5 M main residences x ~100 m^2 ~=
  # 1,850 Mm^2 + ~700 Mm^2 secondary/holiday-home stock).
  # Correction factor = 2,500 / 4,082 = 0.613.
  #
  # The over-count is concentrated in MFH_LOW (EUBUCCO classification rule
  # `floors >= 3 -> MFH_LOW` captures terraced rural housing + mixed-use
  # ground-floor commercial that should be excluded). A per-class area
  # correction would be more granular but requires a Spanish stock-mix
  # decomposition we do not have; the national-level 0.613 captures the
  # aggregate without requiring per-class data.
  #
  # Source: INE Censo de Poblacion y Viviendas 2021 (Statistics Spain),
  #   18,536,616 main residences x ~95-100 m^2 mean useful area + ~700
  #   Mm^2 secondary/empty stock = ~2,500 Mm^2 total. Cross-check via
  #   IDAE SECH-SPAHOUSEC 2011 (Informe Final, ref. year 2010):
  #   17,199,630 main residences x 102.4 m^2 = 1,761 Mm^2 consistent.
  #
  # MECHANISM (clarified 2026-05-21): EUBUCCO ES observed-height share is
  # 95 % (Milojevic-Dupont 2023, Table 1), so floor area per building is
  # well-determined -- this is NOT an imputed-floor data-quality over-count.
  # The over-count is STOCK UTILIZATION: EUBUCCO counts the full standing
  # stock, but ~28 % is vacant (~3.8 M) or secondary/holiday (~3.5 M) and is
  # barely heated in Spain's mild climate. The 0.613 factor calibrates the
  # total standing stock to the heated (occupied) stock, independent of the
  # comfort_regime deflator (which scales intensity within occupied homes) --
  # occupancy x intensity-regime is a clean two-factor decomposition, not
  # double-counting. See literature/eubucco_census_area_audit.md (Mechanism B).
  area_correction: 0.613
  area_correction_source: |
    INE Censos 2021 -- 18.54 M main residences + ~8 M secondary/empty
    dwellings, mean useful area ~95-100 m^2 -> total residential ~2,500
    Mm^2. EUBUCCO ES total: 4,082 Mm^2. Correction = 2,500/4,082 = 0.613.
    Cross-check via IDAE SECH-SPAHOUSEC 2011 (1,761 Mm^2 for main
    residences alone) confirms the anchor.

