# -- TABULA building typology source -----------------------------------------
# Spain IS a TABULA country -- the Spanish residential typology was produced
# by CIEMAT (with IVE-Valencia, IETcc). The DIRECT Spanish typology is used.
# Extraction: code/data/raw/tabula/es_intensities.csv.
tabula:
  source_country: ES
  source_country_name: Spain
  intensities_file: code/data/raw/tabula/es_intensities.csv
  reason_for_proxy: |
    None -- Spain is a TABULA country. The Spanish national residential
    typology (CIEMAT / IVE-Valencia) is used directly, no proxy, no climate
    correction (climate_multiplier = 1.0).

# -- Climate correction ------------------------------------------------------
# Direct TABULA country: climate_multiplier = 1.0.
# Source: Eurostat nrg_chdd_a (base 15 C, JRC AGRI4CAST). The 2018-2022
# 5-year mean is estimated at ~1750 HDD (2022 confirmed at 1478, other years
# 1700-1900 typical range per Eurostat); flagged for direct API extraction.
climate:
  hdd_country: 1750.0        # ES -- 2018-2022 estimate; NEEDS_VERIFY
  hdd_proxy: 1750.0          # ES direct typology -> proxy = self
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 1.0
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST); 2022 confirmed at 1478, 5-year mean estimated

# -- Retrofit-state distribution ---------------------------------------------
# Retrofit FACTORS are the Spanish TABULA typology-averaged refurbishment
# ratios: standard 0.65, advanced 0.40. PROVISIONAL pending WebTool extraction.
#
# Retrofit SHARES are a modelling assumption. Spain's deep renovation rate is
# ~1%/yr; only ~0.2-0.3% of floor area sees deep retrofit per year (EU-wide,
# similar in Spain). PAREER/PAREER II + RRF-funded Component 2 have improved
# this since 2021. The 0.80/0.15/0.05 split reflects ~80% original.
retrofit:
  share:
    original: 0.80          # modelling assumption (Spain deep-retrofit ~1%/yr)
    standard: 0.15          # modelling assumption
    advanced: 0.05          # modelling assumption -- PAREER + RRF deep retrofits
  factor:
    standard: 0.65          # PROVISIONAL -- ES TABULA standard refurb
    advanced: 0.40          # PROVISIONAL -- ES TABULA advanced refurb
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for ES: 0.80 + 0.15x0.65 + 0.05x0.40 = 0.9175
  blend_value: 0.9175
  share_source: |
    Modelling assumption grounded in IDAE / Odyssee-Mure Spain (deep retrofit
    ~1%/yr) and ERESEE 2020. Retrofit factors PROVISIONAL pending the Spanish
    TABULA WebTool extraction.

# -- Domestic Hot Water (DHW) intensity --------------------------------------
dhw:
  sfh: 16.0
  mfh: 14.0
  unit: kWh/m2/yr
  source: Spanish TABULA warm-climate convention (provisional)

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 90.0
  unit: kWh/m2/yr
  source: estimate -- Spanish non-residential (tertiary) space heating
  status: rough placeholder; contributes 0 TWh (zero heated area); flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 173.59           # sum of heat_2015_MWh across all 180 ES NUTS3
                                #   rows in building_stock_nuts3.csv.
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all ES NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 2500
    eubucco_mm2: 4082
    census_eubucco_ratio: 0.61
    source: INE Censos 2021 (2500 Mm2 principal residences; total stock incl. ~28pct vacant/secondary ~3300 Mm2 = ratio 0.81)
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 100.0            # Order-of-magnitude anchor.
    year: 2022
    source: anchored estimate; EU BSO portal not retrievable
  odyssee_mure:
    total_twh: 83.0             # Odyssee-Mure ES residential space heating
                                #   ~7.16 Mtoe (2022, ~40% of household final
                                #   energy) ~83 TWh final-energy basis.
    year: 2022
    source: Odyssee-Mure Spain; residential space heating
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: ES300   # Madrid (representative reference)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco

# -- Operational-regime (comfort) deflator -----------------------------------
# Applied as a multiplier on the SPACE-HEATING component of the per-building
# intensity (DHW unaffected). Translates TABULA reference-condition steady-
# state demand into the realised Spanish stock-weighted regime.
#
# Spain-specific composite: 0.90 (heating-equipment penetration, SPAHOUSEC
# 2011 p.45 -- 10% of Spanish households use no space-heating at all; 14%
# in the Mediterranean zone) x 0.65 (operational realisation factor from
# the Sunikka-Blank & Galvin 2012 "prebound" framework, Mediterranean prior).
# Combined coefficient 0.585 ~ 0.59.
#
# IDAE SECH-SPAHOUSEC 2010 measured Spanish residential heating at ~80 TWh,
# implying national-average ~45-46 kWh/m2/yr -- well below TABULA-calculated
# 60-130 kWh/m2/yr for the Spanish archetype mix. The deflator brings the
# bottom-up into that measured envelope. NOT calibrated to Hotmaps.
#
# Sources:
#  - IDAE (2011), Proyecto SECH-SPAHOUSEC, Informe Final (16-jul-2011),
#    p.45 (heating-equipment penetration) and p.56 (288,574 TJ residential
#    heating total = 80.16 TWh, 47% of household FEC).
#  - Sunikka-Blank, M. & Galvin, R. (2012), "Introducing the prebound effect",
#    Building Research & Information 40(3). DOI 10.1080/09613218.2012.690952.
#  - Sanchez-Guevara et al. (2024), Madrid social-housing monitoring,
#    Building & Environment, DOI 10.1016/j.buildenv.2024.111376.
comfort_regime:
  deflator: 0.59
  source: |
    Composite Spanish operational coefficient: 0.90 SPAHOUSEC heating-equipment
    penetration (IDAE 2011 p.45) x 0.65 Sunikka-Blank & Galvin (2012) prebound
    realisation factor for Mediterranean stock. Anchors against the SPAHOUSEC
    2010 measured national heating intensity of ~45 kWh/m2/yr (80.16 TWh).

