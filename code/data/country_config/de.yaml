# -- Geographic bounding box (WGS84) -----------------------------------------
bbox_wgs84:
  lon_min: 5.87
  lat_min: 47.27
  lon_max: 15.04
  lat_max: 55.06

# -- TABULA building typology source -----------------------------------------
# Germany IS a TABULA country -- the German residential typology was produced
# by IWU Darmstadt. The DIRECT German typology is used (no proxy, no climate
# correction), the same methodological branch as France.
# Extraction: code/data/raw/tabula/de_intensities.csv (header documents the
# IWU 2015 brochure source, the class mapping and the period->cohort mapping).
tabula:
  source_country: DE
  source_country_name: Germany
  intensities_file: code/data/raw/tabula/de_intensities.csv
  reason_for_proxy: |
    None -- Germany is a TABULA country. The German national residential
    typology (IWU Darmstadt, 2015) is used directly, with no proxy and no
    climate correction (climate_multiplier = 1.0).

# -- Climate correction ------------------------------------------------------
# Germany is a direct TABULA country: climate_multiplier = 1.0.
#
# Note (2026-05-19): an Option B reference-HDD correction was briefly applied
# (tabula_reference_hdd = 3300 per the DIN V 18599-10 reference climate cited
# in de_intensities.csv; mult = 0.8624). It was REVERTED after checking the
# Group 1 reconciliation: DE bottom-up was already at 765.82 vs Hotmaps 793.7
# = -3.5 % (OK consistent within +/-15 %). Applying the correction would have
# shifted bottom-up to ~660 TWh = -16.8 %, BREAKING the existing consistency.
# Whatever residual climate-zone bias the DIN reference introduces is already
# offset by other factors (likely EUBUCCO area calibration). See
# literature/climate_reference_hdd_audit.md for the audit lesson.
#
# Source: Eurostat nrg_chdd_a (base 15 C, JRC AGRI4CAST), 5-year mean 2018-2022:
#   DE annual HDD 2018-2022: 2784.88, 2812.97, 2754.54, 3128.38, 2748.46
#   -> mean 2845.85
climate:
  hdd_country: 2845.85       # DE -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_proxy: 2845.85         # DE direct typology -> proxy = self
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 1.0    # direct TABULA country, no climate correction
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST), 5-year mean 2018-2022

# -- Retrofit-state distribution ---------------------------------------------
# Blends the German TABULA refurbishment scenarios (original / standard
# "konventionell" / advanced "zukunftsweisend"). Final blend multiplier:
#   original_share + std_share*std_factor + adv_share*adv_factor.
#
# Retrofit FACTORS are the German TABULA typology-averaged refurbishment
# ratios: standard 0.55, advanced 0.18 of existing-state space-heating need
# (IWU 2015 brochure master table, variants 001/002/003).
#
# Retrofit SHARES are a modelling assumption grounded in Germany's low
# energy-renovation rate of ~1.0%/yr (dena Gebaeudereport 2024; Odyssee-Mure
# Germany). Sustained over ~1990-2024 a ~1%/yr rate implies roughly 40% of the
# stock has had at least one envelope refurbishment; the 0.60/0.30/0.10 split
# reflects that, with most refurbishment being standard rather than deep.
retrofit:
  share:
    original: 0.60          # modelling assumption -- see share_source
    standard: 0.30          # modelling assumption
    advanced: 0.10          # modelling assumption
  factor:
    standard: 0.55          # DE TABULA: standard refurb -> 55% of original SH
    advanced: 0.18          # DE TABULA: advanced refurb -> 18% of original SH
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for DE: 0.60 + 0.30x0.55 + 0.10x0.18 = 0.783
  blend_value: 0.783
  share_source: |
    Modelling assumption consistent with Germany's ~1.0%/yr energy-renovation
    rate (dena Gebaeudereport 2024; Odyssee-Mure Germany country profile). The
    standard/advanced sub-split is an assumption pending an IWU "Datenbasis
    Gebaeudebestand" three-state distribution -- flagged in _meta.

# -- Domestic Hot Water (DHW) intensity --------------------------------------
# DHW is added per building from the TABULA file's dhw column (per class x
# cohort). The values below are the German TABULA area-specific DHW energy
# need, retained for documentation and cross-country reference.
# Source: IWU 2015 German TABULA brochure (Nutzwaerme Warmwasser).
dhw:
  sfh: 11.0
  mfh: 16.5
  unit: kWh/m2/yr
  source: German TABULA brochure (IWU 2015), area-specific DHW energy need

# -- Non-residential intensity (placeholder) ---------------------------------
# Flat country-average applied to the NON_RESIDENTIAL class. The heat-demand
# calculation excludes it from the residential-only reconciliation (zero
# heated area), so the exact value does not affect the bottom-up total.
non_residential_intensity:
  value: 120.0
  unit: kWh/m2/yr
  source: estimate -- German non-residential stock space heating (~100-130 kWh/m2)
  status: rough placeholder; contributes 0 TWh (zero heated area); flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 793.70           # sum of heat_2015_MWh across all 1201 DE NUTS3
                                #   rows in code/data/processed/building_stock_nuts3.csv.
                                #   All-classes total, used as the reconciliation
                                #   target per the LU/FR/FI methodology.
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all DE NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 4070
    eubucco_mm2: 4502
    census_eubucco_ratio: 0.90
    source: Zensus 2022 dwelling floor area
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 650.0            # Order-of-magnitude anchor for the diagnostic
                                #   panel-7 bars; the reconciliation BSO row is
                                #   computed from de_intensity.csv, not this value.
    year: 2022
    source: anchored estimate; EU Building Stock Observatory portal not directly retrievable
  odyssee_mure:
    total_twh: 540.0            # German household space-heating final energy,
                                #   recent (mild) years ~500-550 TWh (AGEB end-use
                                #   shares; Odyssee-Mure Germany). Final-energy
                                #   basis, below the Hotmaps 2015 useful-demand,
                                #   cold-reference-year figure.
    year: 2022
    source: Odyssee-Mure Germany / AGEB household end-use; residential space heating
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: DE300   # Berlin (representative reference)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco
  # Rules (sequential, first match wins):
  # 1. EUBUCCO.type starts with "non-" -> NON_RESIDENTIAL
  # 2. floors >= 6 AND footprint >= 800 -> MFH_HIGH
  # 3. floors <= 2 AND footprint < 250  -> SFH
  # 4. 3 <= floors <= 5                  -> MFH_LOW
  # 5. default (ambiguous large)         -> MFH_HIGH

# -- Provenance + change log -------------------------------------------------
_meta:
  created: 2026-05-19
  created_by: Ali Alajwad (drafted with Claude for OIES paper, build group 1)
  last_verified: 2026-05-19
  schema_version: 1
  status: DRAFT -- direct German TABULA build; values flagged below need
    verification before results are reported. Architecture and citations sound.
  references_doc: literature/germany/classification_methodology.md
  verified_2026_05_19:
    - eubucco.nuts2_partitions (38 DE NUTS2 codes, NUTS 2016/2021)
    - nuts3_regions (401 DE NUTS3 codes, from repo GISCO NUTS 2021 file)
    - climate.hdd_country = 2845.85 (Eurostat nrg_chdd_a DE 2018-2022 mean)
    - tabula source = DE direct; code/data/raw/tabula/de_intensities.csv
      created from the IWU 2015 German TABULA brochure (18 cells)
    - retrofit factors 0.55 / 0.18 -- German TABULA typology-averaged
      refurbishment ratios (IWU 2015 brochure)
  needs_verify_summary:
    - retrofit shares (0.60/0.30/0.10) -- modelling assumption from Germany's
      ~1%/yr renovation rate; no published three-state envelope distribution.
    - de_intensities.csv MFH_HIGH cohorts 1991-2010 onward -- the German TABULA
      defines no large apartment block after 1978; those cells are estimated.
    - non_residential_intensity (120) -- estimate; contributes 0 TWh.
    - reconciliation_benchmarks.eu_bso -- anchored estimate, BSO portal not retrievable.
