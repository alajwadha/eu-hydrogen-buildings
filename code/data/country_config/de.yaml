# Country configuration: Germany (DE)
# ======================================
# All Germany-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/germany/classification_methodology.md.
#
# Schema version: 1 (matches code/src/CountryConfig.py SCHEMA_VERSION).
#
# Germany is a DIRECT TABULA country -- the German residential typology was
# produced by IWU Darmstadt. No proxy and no climate correction are used
# (climate_multiplier = 1.0), the same methodological branch as France.
# Germany is the heavyweight of build group 1 (DE + EE, LV, LT).

country_code: DE
country_name: Germany

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions buildings by NUTS2 region (NUTS 2016 vintage).
# Germany has 38 NUTS2 regions (Regierungsbezirk level). The 38 codes below
# are NUTS 2016, which is also the EUBUCCO v0.2 partition basis; they are
# unchanged in NUTS 2021 for Germany.
eubucco:
  version: v0.2
  nuts2_partitions:
