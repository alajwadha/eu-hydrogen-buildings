# -- Geographic bounding box (WGS84) -----------------------------------------
# Includes Sicily, Sardinia and the Pelagie Islands (southern bound ~Lampedusa).
bbox_wgs84:
  lon_min: 6.63
  lat_min: 35.29
  lon_max: 18.78
  lat_max: 47.09

# -- TABULA building typology source -----------------------------------------
# Italy IS a TABULA country -- the Italian residential typology was produced
# by the TEBE research group at Politecnico di Torino. The DIRECT Italian
# typology is used (no proxy, no climate correction). The Italian TABULA
# defines three climate zones; the reference typology uses the MIDDLE zone
# (2100-3000 HDD). Extraction: code/data/raw/tabula/it_intensities.csv.
tabula:
  source_country: IT
  source_country_name: Italy
  intensities_file: code/data/raw/tabula/it_intensities.csv
  reason_for_proxy: |
    None -- Italy is a TABULA country. The Italian national residential
    typology (Politecnico di Torino) is used directly, no proxy, no climate
    correction (climate_multiplier = 1.0).

# -- Climate correction ------------------------------------------------------
# Italy IS a direct TABULA country, but the Italian TABULA brochure publishes a
# SINGLE reference climate zone -- the MIDDLE zone (2100-3000 HDD per the POLITO
# brochure's own zone definition) -- not a country-mean calibration. Italy's
# actual 2018-2022 mean HDD (1821) sits in the Mediterranean zone (<2100), so
# applying Middle-zone intensities at climate_multiplier=1.0 inflates the bottom-
# up by ~37% (the Group 2 Colab run landed at 668.5 TWh vs Hotmaps 482 TWh,
# flagged INVESTIGATE). The fix introduces tabula_reference_hdd = 2500 (Middle
# zone midpoint) and recomputes climate_multiplier = hdd_country / 2500 = 0.728.
# Expected post-correction bottom-up ~ 487 TWh, within 2% of Hotmaps.
#
# Source: Eurostat nrg_chdd_a (base 15 C, JRC AGRI4CAST), 5-year mean 2018-2022:
#   IT annual HDD: 1879.86, 1746.84, 1813.91, 1748.95, 1916.57 -> mean 1821.23
# Reference HDD: it_intensities.csv brochure header, "MIDDLE reference zone
#   (2100-3000 HDD)". Midpoint 2500 used as best estimate. NEEDS_VERIFY against
#   the TABULA WebTool's per-zone calibration HDD.
climate:
  hdd_country: 1821.23           # IT -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_proxy: 1821.23             # IT direct typology -> proxy = self
  tabula_reference_hdd: 2500     # IT TABULA Middle reference zone midpoint
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 0.7285     # 1821.23 / 2500 (Mediterranean-zone correction)
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST), 5-year mean 2018-2022; tabula_reference_hdd from it_intensities.csv brochure header (Middle zone 2100-3000 HDD)

# -- Retrofit-state distribution ---------------------------------------------
# Retrofit FACTORS are the Italian TABULA typology-averaged refurbishment
# ratios (standard / advanced refurbishment space-heating need relative to the
# existing state). PROVISIONAL pending the it_intensities.csv extraction --
# reconcile against the Italian TABULA refurbishment scenarios.
#
# Retrofit SHARES are a modelling assumption. By May 2024 the Superbonus 110%
# programme had completed ~495,700 residential renovations (~5% of the stock);
# most refurbishment is partial ("standard") rather than deep. The 0.75/0.20/
# 0.05 split reflects ~75% original / ~25% refurbished.
retrofit:
  share:
    original: 0.75          # modelling assumption -- see share_source
    standard: 0.20          # modelling assumption
    advanced: 0.05          # modelling assumption -- Superbonus deep retrofits
  factor:
    standard: 0.62          # PROVISIONAL -- Italian TABULA standard refurb (~38% cut)
    advanced: 0.30          # PROVISIONAL -- Italian TABULA advanced refurb (~70% cut)
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for IT: 0.75 + 0.20x0.62 + 0.05x0.30 = 0.889
  blend_value: 0.889
  share_source: |
    Modelling assumption grounded in ENEA Superbonus 110% reporting (~495,700
    residential renovations to May 2024, ~5% of stock) and Odyssee-Mure Italy.
    Retrofit factors PROVISIONAL pending the it_intensities.csv extraction.

# -- Domestic Hot Water (DHW) intensity --------------------------------------
# DHW is added per building from the TABULA file's dhw column. Values below are
# the Italian TABULA DHW levels (provisional), retained for documentation.
dhw:
  sfh: 18.0
  mfh: 18.0
  unit: kWh/m2/yr
  source: Italian TABULA (Politecnico di Torino); provisional pending extraction

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 110.0
  unit: kWh/m2/yr
  source: estimate -- Italian non-residential (tertiary) stock space heating
  status: rough placeholder; contributes 0 TWh (zero heated area); flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 482.00           # sum of heat_2015_MWh across all 317 IT NUTS3
                                #   rows in building_stock_nuts3.csv. All-classes
                                #   total, per the LU/FR/FI methodology.
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all IT NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 3234
    eubucco_mm2: 4471
    census_eubucco_ratio: 0.72
    source: ISTAT Censimento 2021 (occupied ~2561 Mm2; total stock ~3.2-3.5 Bn m2)
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 320.0            # Order-of-magnitude anchor; the reconciliation
                                #   BSO row is computed from it_intensity.csv.
    year: 2022
    source: anchored estimate; EU Building Stock Observatory portal not retrievable
  odyssee_mure:
    total_twh: 294.0            # ENEA: Italian residential sector ~294 TWh final
                                #   energy (2019), space heating ~70%. Final-energy
                                #   basis -- definitional gap vs Hotmaps useful demand.
    year: 2019
    source: ENEA / Odyssee-Mure Italy; residential final energy
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: ITI43   # Roma (representative reference)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco
  # Rules (sequential, first match wins):
  # 1. EUBUCCO.type starts with "non-" -> NON_RESIDENTIAL
  # 2. floors >= 6 AND footprint >= 800 -> MFH_HIGH
  # 3. floors <= 2 AND footprint < 250  -> SFH
  # 4. 3 <= floors <= 5                  -> MFH_LOW
  # 5. default (ambiguous large)         -> MFH_HIGH

