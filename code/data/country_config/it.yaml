# Country configuration: Italy (IT)
# ====================================
# All Italy-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/italy/classification_methodology.md.
#
# Schema version: 1 (matches code/src/CountryConfig.py SCHEMA_VERSION).
#
# Italy is a DIRECT TABULA country -- the Italian residential typology was
# produced by Politecnico di Torino. No proxy, no climate correction
# (climate_multiplier = 1.0). Italy is the heavyweight of build group 2
# (IT + SI, HR, MT).

country_code: IT
country_name: Italy

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions buildings by NUTS2 region (NUTS 2016 vintage).
# Italy has 21 NUTS2 regions (Trentino-Alto Adige is split into the two
# autonomous provinces ITH1 Bolzano and ITH2 Trento).
eubucco:
  version: v0.2
  nuts2_partitions:
    - ITC1   # Piemonte
    - ITC2   # Valle d'Aosta
    - ITC3   # Liguria
    - ITC4   # Lombardia
    - ITF1   # Abruzzo
    - ITF2   # Molise
    - ITF3   # Campania
    - ITF4   # Puglia
    - ITF5   # Basilicata
    - ITF6   # Calabria
    - ITG1   # Sicilia
    - ITG2   # Sardegna
    - ITH1   # Provincia Autonoma di Bolzano/Bozen
    - ITH2   # Provincia Autonoma di Trento
    - ITH3   # Veneto
    - ITH4   # Friuli-Venezia Giulia
    - ITH5   # Emilia-Romagna
    - ITI1   # Toscana
    - ITI2   # Umbria
    - ITI3   # Marche
    - ITI4   # Lazio
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  # Citation: Milojevic-Dupont N. et al. (2023). EUBUCCO v0.1.
  # Scientific Data 10:147. DOI 10.1038/s41597-023-02040-2.
  license: ODbL v1.0

