# -- TABULA building typology source -----------------------------------------
# Poland IS a TABULA country -- this is the DIRECT national typology
# (tabula.source_country = PL). Produced by NAPE (Narodowa Agencja
# Poszanowania Energii / Polish National Energy Conservation Agency) under
# the IEE TABULA 2009-2012 project. The same pl_intensities.csv file is also
# used as the climate-corrected proxy for EE, LV, LT (build group 1).
#
# IMPORTANT METHODOLOGICAL CAVEAT (carried over from pl_intensities.csv
# header): Polish TABULA values are DERIVED from published EK (energia
# koncowa = final energy) figures by deducting DHW + applying period
# heating-system efficiencies. They are NOT the TABULA-harmonised net SH
# values; treat as best estimates with +/-15-20% uncertainty.
tabula:
  source_country: PL
  source_country_name: Poland
  intensities_file: code/data/raw/tabula/pl_intensities.csv
  reason_for_proxy: |
    Poland is a TABULA country (NAPE). Direct typology used without proxy
    (climate_multiplier = 1.0). The same file pl_intensities.csv was originally
    built as the climate-corrected proxy for the Baltic states; here Poland
    uses it directly. Values are DERIVED from Polish EK (final energy) figures
    rather than TABULA-harmonised net SH; flagged in the TABULA file header.

# -- Climate correction ------------------------------------------------------
# Poland is a direct TABULA country. The Polish TABULA values are calibrated
# to Polish national-mean climate (the EK certificate methodology uses a
# climate normalisation built into the certificate, not a fixed reference
# zone). tabula_reference_hdd defaults to hdd_proxy (= hdd_country for direct),
# giving climate_multiplier = 1.0. See literature/climate_reference_hdd_audit.md
# for the audit decision (PL is in the NO CHANGE set).
#
# Source: Eurostat nrg_chdd_a (base 15 C, JRC AGRI4CAST), 5-year mean 2018-2022:
#   PL annual HDD: 3126.18, 2954.00, 3011.03, 3497.15, 3205.03 -> mean 3158.7
climate:
  hdd_country: 3158.7            # PL -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_proxy: 3158.7              # PL direct typology -> proxy = self
  tabula_reference_hdd: 3158.7   # PL TABULA calibrated to Polish national mean
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 1.0        # direct TABULA country
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST), 5-year mean 2018-2022

# -- Retrofit-state distribution ---------------------------------------------
# Retrofit FACTORS are the Polish TABULA typology-averaged refurbishment
# ratios (published in NAPE Sec. 3.4.3): standard/improved refurbishment
# ~0.63 of existing-state space-heating need; advanced/ambitious ~0.50.
#
# Retrofit SHARES are a modelling assumption. Poland's residential renovation
# rate is low (~1 percent/yr; mostly shallow). Czyste Powietrze ("Clean Air")
# programme has funded ~700k mostly-shallow retrofits to 2024 (~6-7 pct of
# stock). Deep retrofits are a small share (Stop-Smog gminne; EU RPO/POIiS).
retrofit:
  share:
    original: 0.78          # modelling assumption (coal-heavy un-renovated SFH)
    standard: 0.17          # Czyste Powietrze shallow + window/boiler swaps
    advanced: 0.05          # deep retrofits (Stop-Smog; EU funds)
  factor:
    standard: 0.63          # Polish TABULA standard refurbishment (NAPE Sec 3.4.3)
    advanced: 0.50          # Polish TABULA advanced refurbishment (NAPE Sec 3.4.3)
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for PL: 0.78 + 0.17x0.63 + 0.05x0.50 = 0.912
  blend_value: 0.912
  share_source: |
    Modelling assumption grounded in the Polish Long-Term Renovation Strategy
    (Ministerstwo Rozwoju i Technologii 2022) and Czyste Powietrze programme
    cumulative reporting (NFOSiGW 2024; ~700k retrofits to 2024).

# -- Domestic Hot Water (DHW) intensity --------------------------------------
dhw:
  sfh: 28.0
  mfh: 23.0
  unit: kWh/m2/yr
  source: Polish TABULA DHW convention (DERIVED in pl_intensities.csv from the Polish energy-certificate DHW assumption; provisional pending verification)

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 145.0
  unit: kWh/m2/yr
  source: estimate -- Polish non-residential stock space heating (coal-heavy historical; offices + retail + public buildings)
  status: rough placeholder; contributes 0 TWh (zero heated area); flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 257.93           # sum of heat_2015_MWh across all 72 PL NUTS3
                                #   rows in building_stock_nuts3.csv. NUTS 2016
                                #   vintage; PLZZ extraterritorial excluded.
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all PL NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 1139
    eubucco_mm2: 1716
    census_eubucco_ratio: 0.66
    source: GUS NSP 2021 dwelling stock
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 210.0            # Order-of-magnitude anchor; the reconciliation
                                #   BSO row is computed from pl_intensity.csv.
    year: 2022
    source: anchored estimate; EU Building Stock Observatory portal not retrievable
  odyssee_mure:
    total_twh: 190.0            # Odyssee-Mure PL residential space heating
                                #   back-calculated from ~13 Mtoe final energy
                                #   / 0.7-0.8 efficiency ~ 190 TWh useful demand.
    year: 2022
    source: Odyssee-Mure Poland; residential space heating (back-calculated to useful demand)
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: PL911   # Miasto Warszawa (NUTS 2021; was PL127 under NUTS 2016)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco
  # Rules (sequential, first match wins):
  # 1. EUBUCCO.type starts with "non-" -> NON_RESIDENTIAL
  # 2. floors >= 6 AND footprint >= 800 -> MFH_HIGH
  # 3. floors <= 2 AND footprint < 250  -> SFH
  # 4. 3 <= floors <= 5                  -> MFH_LOW
  # 5. default (ambiguous large)         -> MFH_HIGH

