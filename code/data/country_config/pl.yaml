# Country configuration: Poland (PL)
# ======================================
# All Poland-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/poland/classification_methodology.md.
#
# Schema version: 1 (matches code/src/CountryConfig.py SCHEMA_VERSION).
#
# STATUS: DRAFT. Poland is a DIRECT TABULA country (NAPE / Narodowa Agencja
# Poszanowania Energii). Build group 4 (PL + CZ, SK, HU; Visegrad).
# Poland is the heavyweight of group 4 (Hotmaps 2015 baseline 257.93 TWh).

country_code: PL
country_name: Poland

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions buildings by NUTS2 region. Poland's NUTS2 codes were
# substantially RECODED at the NUTS 2018 amendment (Commission Regulation
# 2017/2391, effective 2018-01-01). EUBUCCO v0.2 was built with the
# POST-amendment NUTS 2021 codes for Poland (PL21/PL22/PL41-PL43/.../PL91-PL92,
# 17 regions). The pre-2018 NUTS 2016 codes (PL11/PL12/PL31-PL34/...) return
# HTTP 404 from the s3.eubucco.com bucket; verified 2026-05-20 by direct probe.
# This is the only country in build groups 1-4 where EUBUCCO uses NUTS 2021;
# all others use NUTS 2016 (some happen to be stable across vintages).
eubucco:
  version: v0.2
  nuts2_partitions:
    - PL21   # Malopolskie
    - PL22   # Slaskie
    - PL41   # Wielkopolskie
    - PL42   # Zachodniopomorskie
    - PL43   # Lubuskie
    - PL51   # Dolnoslaskie
    - PL52   # Opolskie
    - PL61   # Kujawsko-pomorskie
    - PL62   # Warminsko-mazurskie
    - PL63   # Pomorskie
    - PL71   # Lodzkie (was PL11 under NUTS 2016)
    - PL72   # Swietokrzyskie (was PL33)
    - PL81   # Lubelskie (was PL31)
    - PL82   # Podkarpackie (was PL32)
    - PL84   # Podlaskie (was PL34)
    - PL91   # Warszawski stoleczny (NEW; was part of PL12)
    - PL92   # Mazowiecki regionalny (NEW; was part of PL12)
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  # Citation: Milojevic-Dupont N. et al. (2023). EUBUCCO v0.1.
  # Scientific Data 10:147. DOI 10.1038/s41597-023-02040-2.
  license: ODbL v1.0

