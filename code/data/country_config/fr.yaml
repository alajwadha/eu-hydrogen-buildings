  schema_version: 1
  status: VERIFIED — all 4 primary reconciliation parameters now derived from primary sources; only per-cohort retrofit refinements remain as future work
  references_doc: literature/france/classification_methodology.md
  verified_2026_05_15:
    - eubucco.nuts2_partitions (NUTS 2016 codes confirmed via EUBUCCO docs)
    - eubucco region_id column (EUBUCCO parquets already carry NUTS3 per building)
    - climate.hdd_country = 2183 (Eurostat 2018-2022 mean via DBnomics A.NR.HDD.FR)
    - climate.climate_multiplier = 1.0 (direct TABULA, confirmed)
    - tabula intensities — code/data/raw/tabula/fr_intensities.csv created from
      tabula-calculator.xlsx (FR.01-FR.10 cohorts mapped to our 6, all 18 cells filled)
    - dhw.sfh = 10.0 / dhw.mfh = 15.0 (TABULA harmonised q_w_nd, not FR national 3CL-DPE)
    - retrofit factors (0.57 standard / 0.35 advanced) — TABULA-FR brochure Tableau 4
    - retrofit shares (0.305 original / 0.609 standard / 0.086 advanced) — SDES 2025
      DPE distribution of residential stock, with DPE→retrofit-state mapping documented
      in literature/france/classification_methodology.md
    - non_residential_intensity = 120.0 (CEREN/Ministry tertiary 240 kWh/m² × ~50% heating share)
    - reconciliation_benchmarks.hotmaps.total_twh = 515.1 (computed from repo CSV)
    - reconciliation_benchmarks.eu_bso.total_twh = 290 (BPIE Jan 2023, FR 2020 = 283 TWh)
    - reconciliation_benchmarks.odyssee_mure.total_twh = 310 (2017, FfE eXtremOS cross-ref)
    - code/data/raw/eu_bso/fr_intensity.csv created (stock weights from brochure Tableau 1)
  needs_verify_summary:
    - per-cohort retrofit factor scheme (FR brochure Tableau 4 has 3 period bands;
      current implementation uses single 1975-2005 average for all cohorts — flagged
      as future refinement, can be revisited after FR pipeline run reveals whether
