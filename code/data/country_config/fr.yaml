# Country configuration: France (FR)
# =====================================
# All France-specific parameters for the building-stock pipeline.
# Sources cited inline. Methodology framework mirrors Luxembourg
# (TABULA-based intensities, climate correction, retrofit blending,
# 4-class taxonomy, multi-source reconciliation), but France-specific:
# direct TABULA-FR data (no proxy) and ADEME/CEREN retrofit shares.
#
# Schema version: 1 (matches code/src/CountryConfig.py SCHEMA_VERSION).
#
# STATUS: DRAFT — Some values flagged below need final verification before
# the FR pipeline is run for the OIES paper. The architecture is correct
# and the citations are real; specific numerical values marked NEEDS_VERIFY
# should be cross-checked against the original source documents before the
# results are reported to reviewers.

country_code: FR
country_name: France

# ── EUBUCCO data source ─────────────────────────────────────────────────────
# France has 22 NUTS2 regions in metropolitan France. EUBUCCO v0.2 covers
# metropolitan France only (overseas FRY1-FRY5 not in v0.2).
#
# Source: EUROSTAT NUTS 2016 classification (verified at
# https://docs.eubucco.com/v0.2/data-format/schema/ — "EUBUCCO uses modified
# NUTS 2016 boundaries with two regional merges DEB33->DEB3H, UKD73->UKD47").
# Also confirmed: EUBUCCO parquets contain a 'region_id' column with the
# NUTS3 code per building (verified 2026-05-15), so the multi-NUTS3 spatial
# join in 02_classify.py is optional rather than required for FR.
eubucco:
  version: v0.2
  nuts2_partitions:
    - FR10   # Île-de-France
    - FRB0   # Centre-Val de Loire
    - FRC1   # Bourgogne
    - FRC2   # Franche-Comté
    - FRD1   # Basse-Normandie
    - FRD2   # Haute-Normandie
    - FRE1   # Nord-Pas-de-Calais
    - FRE2   # Picardie
    - FRF1   # Alsace
    - FRF2   # Champagne-Ardenne
    - FRF3   # Lorraine
    - FRG0   # Pays de la Loire
    - FRH0   # Bretagne
    - FRI1   # Aquitaine
    - FRI2   # Limousin
    - FRI3   # Poitou-Charentes
    - FRJ1   # Languedoc-Roussillon
    - FRJ2   # Midi-Pyrénées
    - FRK1   # Auvergne
    - FRK2   # Rhône-Alpes
    - FRL0   # Provence-Alpes-Côte d'Azur
    - FRM0   # Corse
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
