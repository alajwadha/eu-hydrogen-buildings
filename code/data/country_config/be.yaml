# Country configuration: Belgium (BE)
# =====================================
# All Belgium-specific parameters for the building-stock pipeline.
# Methodology: literature/belgium/classification_methodology.md.
#
# Schema version: 1. Build group 5 (AT + BE, NL, IE; NW temperate Europe).
# Belgium is a DIRECT TABULA country (VITO; Cyx, Renders, Van Holm, Verbeke
# 2011). Note: be_intensities.csv was originally created as the LU proxy; the
# same file is the DIRECT TABULA source for BE.

country_code: BE
country_name: Belgium

# -- EUBUCCO data source -----------------------------------------------------
# 11 NUTS2 regions; stable across NUTS 2013/2016/2021.
eubucco:
  version: v0.2
  nuts2_partitions:
    - BE10   # Region de Bruxelles-Capitale
    - BE21   # Prov. Antwerpen
    - BE22   # Prov. Limburg (BE)
    - BE23   # Prov. Oost-Vlaanderen
    - BE24   # Prov. Vlaams-Brabant
    - BE25   # Prov. West-Vlaanderen
    - BE31   # Prov. Brabant Wallon
    - BE32   # Prov. Hainaut
    - BE33   # Prov. Liege
    - BE34   # Prov. Luxembourg (BE)
    - BE35   # Prov. Namur
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  license: ODbL v1.0

# -- NUTS3 regions -----------------------------------------------------------
# 44 NUTS3 (arrondissements); BE336/BE337 (Verviers split) from NUTS 2016.
