  status: DRAFT -- CZ-proxy TABULA build. RO has no national TABULA; URBAN-
    INCERC research is descriptive not harmonised. CZ chosen for panelák ~
    blocuri MFH-lineage match. EU's 2nd-highest under-heating prevalence
    (24-26pct EU-SILC 2022) -- comfort regime deflator is a strong follow-up
    candidate.
  references_doc: literature/romania/classification_methodology.md
  verified_2026_05_20:
    - eubucco.nuts2_partitions (8 RO NUTS2, stable across NUTS vintages)
    - nuts3_regions (42 RO NUTS3 judete + Bucuresti, stable)
    - tabula source = CZ proxy
    - tabula_reference_hdd = 3400 (CZ CSN 73 0540 reference)
    - climate_multiplier = 0.8250 (2805 / 3400)
  needs_verify_summary:
    - HDD 2018-2022 mean ~2805 -- estimated; pull exact Eurostat nrg_chdd_a.
    - HU overlay for RO11+RO42 Pannonian Banat counties -- deferred to NUTS3
      region_split_proxy schema extension (also needed for HR).
    - retrofit shares (0.80/0.15/0.05) -- modelling assumption.
    - comfort_regime deflator -- candidate follow-up; EU-SILC 24-26pct under-
      heating documented; INCERC/UTCB prebound 25-40pct (Cherecheș, Pătrașcu).
    - Hotmaps total (82) -- estimate; sum building_stock_nuts3.csv exactly.
