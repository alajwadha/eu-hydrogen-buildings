# Country configuration: Lithuania (LT)
# ========================================
# All Lithuania-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/lithuania/classification_methodology.md.
#
# Schema version: 1 (matches code/src/CountryConfig.py SCHEMA_VERSION).
#
# STATUS: DRAFT -- Lithuania is NOT a TABULA country. Poland (PL) is used as
# the climate-corrected TABULA proxy. Lithuania is one of the three Baltic
# states in build group 1 (DE + EE, LV, LT); all three use Poland as proxy.
# Values marked NEEDS_VERIFY are listed at the foot of this file.

country_code: LT
country_name: Lithuania

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions buildings by NUTS2 region (NUTS 2016 vintage).
# Lithuania's NUTS2 structure changed at the 2016 revision: from a single
# region (LT00) to two -- LT01 Sostines regionas (Capital region) and LT02
# Vidurio ir vakaru Lietuvos regionas (Central & Western Lithuania). EUBUCCO
# v0.2 (NUTS 2016) therefore provides two Lithuanian partitions.
eubucco:
  version: v0.2
  nuts2_partitions:
    - LT01   # Sostines regionas (Capital region)
    - LT02   # Vidurio ir vakaru Lietuvos regionas (Central & Western Lithuania)
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  # Citation: Milojevic-Dupont N. et al. (2023). EUBUCCO v0.1.
  # Scientific Data 10:147. DOI 10.1038/s41597-023-02040-2.
  license: ODbL v1.0
  # EUBUCCO area-correction factor (applied 2026-05-20).
  # The pre-class-mix G1 Colab build landed LT at 38.7 TWh vs Hotmaps 17.29
  # = +123.9 pct INV. Class-mix proxy (commit 644caf6) is the intensity-layer
  # fix (SFH from SE, MFH from PL); the area layer has its own over-count
  # documented here:
  #
  # EUBUCCO LT total residential = 199 Mm^2 (BU 38.7 TWh / 194 kWh/m^2).
  # Statistics Lithuania 2021 Census of Population & Housing anchors the
  # actual LT residential floor area at:
  #   1.31 M occupied dwellings x ~72 m^2 weighted-mean useful area
  #   (22 pct detached houses ~140 m^2 + 72 pct apartments ~52 m^2
  #   + 6 pct other ~70 m^2) = ~94 Mm^2 main residences
  #   + ~10 Mm^2 secondary/holiday stock = ~104 Mm^2 total.
  # Correction = 104 / 199 = 0.522 ~ 0.52.
  #
  # NOTE: the previous methodology doc claim that "EUBUCCO floor area is
  # essentially right -- our 199 Mm^2 aligns within ~2 pct of LT pop 2.8 M
  # x ~70 m^2/dwelling" was a math error -- it multiplied total POPULATION
  # by per-DWELLING area, conflating two units. Correct comparison is
  # households (1.31 M) x m^2/dwelling. This commit corrects that.
  #
  # Source: Statistics Lithuania, 2021 Census of Population, Households
  #   and Housing. https://osp.stat.gov.lt/en/gyventoju-ir-bustu-surasymai-2021
  # MECHANISM (clarified 2026-05-21): imputed-floor area over-count.
  # EUBUCCO LT observed-height share is 0% (Milojevic-Dupont 2023,
  # Table 1); floors -- hence floor area -- are ML-imputed even though the
  # footprints are cadastre-sourced. The correction calibrates the imputed
  # area to the census. See literature/eubucco_census_area_audit.md
  # (Mechanism A).
  area_correction: 0.52
  area_correction_source: |
    Statistics Lithuania 2021 Census of Population, Households and Housing:
    1.31 M occupied dwellings x ~72 m^2 weighted-mean useful area = ~94
    Mm^2 main residences + ~10 Mm^2 secondary = ~104 Mm^2 total. EUBUCCO
    LT total: 199 Mm^2. Correction = 104/199 = 0.522. Corrects the prior
    methodology-doc math error (pop x m^2/dwelling instead of households
    x m^2/dwelling).

# -- NUTS3 regions -----------------------------------------------------------
# Lithuania has 10 NUTS3 regions (counties / apskritys). Codes are identical in
# NUTS 2016 and NUTS 2021. LT011 sits under NUTS2 LT01; the other nine under LT02.
nuts3_regions:
  - LT011   # Vilniaus apskritis (Vilnius County)
  - LT021   # Alytaus apskritis
  - LT022   # Kauno apskritis (Kaunas County)
  - LT023   # Klaipedos apskritis (Klaipeda County)
  - LT024   # Marijampoles apskritis
  - LT025   # Panevezio apskritis
  - LT026   # Siauliu apskritis
  - LT027   # Taurages apskritis
  - LT028   # Telsiu apskritis
  - LT029   # Utenos apskritis

# -- Geographic bounding box (WGS84) -----------------------------------------
bbox_wgs84:
  lon_min: 19.0
  lat_min: 53.9
  lon_max: 26.9
  lat_max: 56.5

# -- TABULA building typology source -----------------------------------------
# Lithuania is NOT a TABULA country. Poland (PL) is used as the TABULA proxy.
#
# Lithuania uses Poland TABULA as proxy because:
#   1. Lithuania's residential stock is dominated by Soviet-era prefabricated
#      large-panel concrete apartment blocks (~35,000 Soviet-era apartment
#      buildings, ~72% of multi-dwelling floor area) plus older masonry and
#      rural timber houses. Poland's TABULA typology explicitly carries the
#      Soviet/Comecon-era large-panel ("wielka plyta") apartment class.
#   2. Shared post-war central-planning construction norms (SNiP-derived).
#   3. Poland is the closest panel-bearing TABULA country; Lithuania is the
#      mildest of the three Baltics, so it carries the smallest HDD correction.
# See literature/lithuania/classification_methodology.md section 2.2.
# Extraction: code/data/raw/tabula/pl_intensities.csv.
tabula:
  source_country: PL
  source_country_name: Poland
  intensities_file: code/data/raw/tabula/pl_intensities.csv
  reason_for_proxy: |
    Lithuania has no national TABULA typology. Poland is the closest TABULA
    country whose multi-family typology carries the Soviet-era large-panel
    apartment class that dominates the Lithuanian residential stock. Lithuanian
    heat intensities are Poland-derived, climate-corrected by the HDD_LT/HDD_PL
    ratio (1.1522).
  # CLASS-MIX PROXY (applied 2026-05-20). Lithuanian residential stock is
  # structurally bifurcated: ~22 % wooden cold-climate SFH (rural medinis
  # namas) and ~72 % Soviet-era industrialised panel-block MFH. Single-
  # proxy (PL for everything) over-states SFH because the PL large-panel
  # typology runs hot relative to the timber-framed Lithuanian and Nordic
  # single-family stock. Per the audit doc (literature/inv_countries
  # _academic_refinements.md, Baltic cluster), the academically-defensible
  # refinement pulls SFH from the Swedish TABULA (cold-climate timber-
  # detached typology) and leaves MFH on PL (panel-block typology match
  # retained). Lithuania's wooden-SFH share is smaller than Estonia's, so
  # the expected gain from class-mix is more modest; APVA-direct typology
  # is the longer-term refinement (see methodology doc section 7).
  # Per-class climate multipliers:
  #   SFH (SE):   3639.5 / 3500 = 1.040 (vs SE TABULA zone-3 ref ~3500)
  #   MFH_*: 3639.5 / 3158.7 = 1.152 (PL national mean, unchanged)
  class_mix:
    SFH:
      file: code/data/raw/tabula/se_intensities.csv
      climate_multiplier: 1.040
      source_country: SE
      reason: |
        Swedish TABULA Enfamiljshus typology (timber-framed cold-climate
        SFH) is a structurally closer match to Lithuanian wooden detached
        houses than the Polish wielka-plyta-dominated typology. Scaled by
        HDD_LT/HDD_SE_zone3 = 3639.5/3500 = 1.040.
    MFH_LOW:
      file: code/data/raw/tabula/pl_intensities.csv
      climate_multiplier: 1.1522
      source_country: PL
      reason: PL panel-block typology (Soviet/Comecon-era industrialised MFH match).
    MFH_HIGH:
      file: code/data/raw/tabula/pl_intensities.csv
      climate_multiplier: 1.1522
      source_country: PL
      reason: Same as MFH_LOW.

# -- Climate correction ------------------------------------------------------
# Source: Eurostat nrg_chdd_a (base 15 C, JRC AGRI4CAST), 5-year mean 2018-2022:
#   LT annual HDD: 3692.16, 3394.26, 3310.44, 4022.50, 3778.37 -> mean 3639.55
#   PL annual HDD: 3126.18, 2954.00, 3011.03, 3497.15, 3205.03 -> mean 3158.68
climate:
  hdd_country: 3639.5        # LT -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_proxy: 3158.7          # PL -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 1.1522 # 3639.5 / 3158.7
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST), 5-year mean 2018-2022

# -- Retrofit-state distribution ---------------------------------------------
# Retrofit FACTORS are the Poland TABULA typology-averaged refurbishment ratios
# (standard 0.63, advanced 0.50).
#
# Retrofit SHARES are a modelling assumption. Lithuania runs one of Europe's
# most prominent multi-apartment renovation programmes (APVA), but as of the
# early-2020s baseline only ~2,200 of ~38,000 pre-1993 multi-apartment
# buildings were fully renovated (<15% of eligible blocks, ~5% of total stock).
# The 0.88/0.08/0.04 split reflects an ~88% original / ~12% refurbished stock.
retrofit:
  share:
    original: 0.88          # modelling assumption -- see share_source
    standard: 0.08          # modelling assumption
    advanced: 0.04          # modelling assumption -- APVA deep-renovated stock
  factor:
    standard: 0.63          # PL TABULA: standard refurb -> 63% of original SH
    advanced: 0.50          # PL TABULA: advanced refurb -> 50% of original SH
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for LT: 0.88 + 0.08x0.63 + 0.04x0.50 = 0.9504
  blend_value: 0.9504
  share_source: |
    Modelling assumption grounded in the Lithuanian Long-Term Renovation
    Strategy (2020) and APVA multi-apartment renovation programme reporting
    (~2,200 buildings fully renovated of ~38,000). The standard/advanced
    sub-split is an assumption -- flagged.

# -- Domestic Hot Water (DHW) intensity --------------------------------------
dhw:
  sfh: 28.0
  mfh: 23.0
  unit: kWh/m2/yr
  source: Poland TABULA proxy (pl_intensities.csv); Polish energy-certificate DHW

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 150.0
  unit: kWh/m2/yr
  source: estimate -- Lithuanian non-residential stock space heating (~140-180 kWh/m2)
  status: rough placeholder; contributes 0 TWh (zero heated area); flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 17.29            # sum of heat_2015_MWh across all 13 LT NUTS3
                                #   rows in building_stock_nuts3.csv. All-classes
                                #   total, per the LU/FR/FI methodology.
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all LT NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 104
    eubucco_mm2: 200
    census_eubucco_ratio: 0.52
    source: Statistics Lithuania REL 2021 (1.31M dwellings x ~72 m2 + ~10 Mm2 secondary)
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 13.0             # Order-of-magnitude anchor; the reconciliation
                                #   BSO row is computed from lt_intensity.csv.
    year: 2022
    source: anchored estimate; EU Building Stock Observatory portal not retrievable
  odyssee_mure:
    total_twh: 11.0             # Lithuania residential space heating, final-energy
                                #   basis estimate (DH ~5.2 TWh to households,
                                #   ~50% of household heating).
    year: 2022
    source: Odyssee-Mure Lithuania / LSTA district-heating data; residential space heating
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: LT011   # Vilnius County (representative reference)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco
  # Rules (sequential, first match wins):
  # 1. EUBUCCO.type starts with "non-" -> NON_RESIDENTIAL
  # 2. floors >= 6 AND footprint >= 800 -> MFH_HIGH
  # 3. floors <= 2 AND footprint < 250  -> SFH
  # 4. 3 <= floors <= 5                  -> MFH_LOW
  # 5. default (ambiguous large)         -> MFH_HIGH

