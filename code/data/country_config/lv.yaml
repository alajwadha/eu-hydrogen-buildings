# Country configuration: Latvia (LV)
# =====================================
# All Latvia-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/latvia/classification_methodology.md.
#
# Schema version: 1 (matches code/src/CountryConfig.py SCHEMA_VERSION).
#
# STATUS: DRAFT -- Latvia is NOT a TABULA country. Poland (PL) is used as the
# climate-corrected TABULA proxy. Latvia is one of the three Baltic states in
# build group 1 (DE + EE, LV, LT); all three use Poland as proxy. Values
# marked NEEDS_VERIFY are listed at the foot of this file.

country_code: LV
country_name: Latvia

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions buildings by NUTS2 region (NUTS 2016 vintage).
# Latvia is a single NUTS2 region (LV00 = the whole country).
eubucco:
  version: v0.2
  nuts2_partitions:
    - LV00
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  # Citation: Milojevic-Dupont N. et al. (2023). EUBUCCO v0.1.
  # Scientific Data 10:147. DOI 10.1038/s41597-023-02040-2.
  license: ODbL v1.0

# -- NUTS3 regions -----------------------------------------------------------
# Latvia has 6 NUTS3 regions (planning regions). The 6 codes are unchanged
# between NUTS 2016 and NUTS 2021 (the 2021 revision adjusted boundaries under
# Latvia's 2021 administrative-territorial reform but kept the codes).
nuts3_regions:
  - LV003   # Kurzeme
  - LV005   # Latgale
  - LV006   # Riga
  - LV007   # Pieriga
  - LV008   # Vidzeme
  - LV009   # Zemgale

# -- Geographic bounding box (WGS84) -----------------------------------------
bbox_wgs84:
  lon_min: 20.9
  lat_min: 55.6
  lon_max: 28.3
  lat_max: 58.1

# -- TABULA building typology source -----------------------------------------
# Latvia is NOT a TABULA country. Poland (PL) is used as the TABULA proxy.
#
# Latvia uses Poland TABULA as proxy because:
#   1. Latvia's residential stock is dominated by Soviet-era prefabricated
#      large-panel concrete apartment blocks (serial types 103, 104, 119, 467,
#      602) plus older Riga masonry and rural timber houses. Poland's TABULA
#      typology explicitly carries the Soviet/Comecon-era large-panel
#      ("wielka plyta") apartment class -- the same industrialised construction
#      lineage as the Latvian serial panel blocks.
#   2. Shared post-war central-planning construction norms.
#   3. Poland is the closest panel-bearing TABULA country, keeping the climate
#      correction moderate.
# See literature/latvia/classification_methodology.md section 2.2.
# Extraction: code/data/raw/tabula/pl_intensities.csv.
tabula:
  source_country: PL
  source_country_name: Poland
  intensities_file: code/data/raw/tabula/pl_intensities.csv
  reason_for_proxy: |
    Latvia has no national TABULA typology. Poland is the closest TABULA
    country whose multi-family typology carries the Soviet-era large-panel
    apartment class that dominates the Latvian residential stock. Latvian heat
    intensities are Poland-derived, climate-corrected by the HDD_LV/HDD_PL
    ratio (1.2088).

# -- Climate correction ------------------------------------------------------
# Source: Eurostat nrg_chdd_a (base 15 C, JRC AGRI4CAST), 5-year mean 2018-2022:
#   LV annual HDD: 3870.56, 3633.98, 3413.39, 4151.13, 4022.19 -> mean 3818.25
#   PL annual HDD: 3126.18, 2954.00, 3011.03, 3497.15, 3205.03 -> mean 3158.68
climate:
  hdd_country: 3818.3        # LV -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_proxy: 3158.7          # PL -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 1.2088 # 3818.3 / 3158.7
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST), 5-year mean 2018-2022

# -- Retrofit-state distribution ---------------------------------------------
# Retrofit FACTORS are the Poland TABULA typology-averaged refurbishment ratios
# (standard 0.63, advanced 0.50).
#
# Retrofit SHARES are a modelling assumption. Latvia's renovation pace is the
# lowest of the Baltics: only ~4% of residential buildings have been deeply
# renovated (~1,900 of ~39,000 multi-apartment buildings). The 0.90/0.07/0.03
# split reflects an ~90% original / ~10% refurbished stock.
retrofit:
  share:
    original: 0.90          # modelling assumption -- see share_source
    standard: 0.07          # modelling assumption
    advanced: 0.03          # modelling assumption -- ALTUM deep-renovated stock
  factor:
    standard: 0.63          # PL TABULA: standard refurb -> 63% of original SH
    advanced: 0.50          # PL TABULA: advanced refurb -> 50% of original SH
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for LV: 0.90 + 0.07x0.63 + 0.03x0.50 = 0.9591
  blend_value: 0.9591
  share_source: |
    Modelling assumption grounded in the Latvian Long-Term Renovation Strategy
    and ALTUM programme reporting (~4% of residential buildings deeply
    renovated; renovation pace flagged "critically low" by the State Audit
    Office). The standard/advanced sub-split is an assumption -- flagged.

# -- Domestic Hot Water (DHW) intensity --------------------------------------
dhw:
  sfh: 28.0
  mfh: 23.0
  unit: kWh/m2/yr
  source: Poland TABULA proxy (pl_intensities.csv); Polish energy-certificate DHW

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 160.0
  unit: kWh/m2/yr
  source: estimate -- Latvian non-residential stock space heating (~150-180 kWh/m2)
  status: rough placeholder; contributes 0 TWh (zero heated area); flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 18.22            # sum of heat_2015_MWh across all 21 LV NUTS3
                                #   rows in building_stock_nuts3.csv. All-classes
                                #   total, per the LU/FR/FI methodology.
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all LV NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 68
    eubucco_mm2: 105
    census_eubucco_ratio: 0.65
    source: CSB Latvia 2021 census dwelling stock
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 14.0             # Order-of-magnitude anchor; the reconciliation
                                #   BSO row is computed from lv_intensity.csv.
    year: 2022
    source: anchored estimate; EU Building Stock Observatory portal not retrievable
  odyssee_mure:
    total_twh: 13.0             # Latvia residential space-heating; Odyssee-Mure
                                #   reports intensity ~141 kWh/m2 (2023, down from
                                #   ~185 in 2010). Final-energy basis estimate.
    year: 2023
    source: Odyssee-Mure Latvia; residential space heating (intensity x floor area)
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: LV006   # Riga (representative reference)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco
  # Rules (sequential, first match wins):
  # 1. EUBUCCO.type starts with "non-" -> NON_RESIDENTIAL
  # 2. floors >= 6 AND footprint >= 800 -> MFH_HIGH
  # 3. floors <= 2 AND footprint < 250  -> SFH
  # 4. 3 <= floors <= 5                  -> MFH_LOW
  # 5. default (ambiguous large)         -> MFH_HIGH

# -- Provenance + change log -------------------------------------------------
_meta:
  created: 2026-05-19
  created_by: Ali Alajwad (drafted with Claude for OIES paper, build group 1)
  last_verified: 2026-05-19
  schema_version: 1
  status: DRAFT -- Poland-proxy TABULA build; scalar values flagged below need
    verification before results are reported. Architecture and citations sound.
  references_doc: literature/latvia/classification_methodology.md
  verified_2026_05_19:
    - eubucco.nuts2_partitions (LV00, single NUTS2)
    - nuts3_regions (6 LV NUTS3 codes, stable NUTS 2016/2021)
    - climate.hdd_country = 3818.3 / hdd_proxy = 3158.7 (Eurostat nrg_chdd_a 2018-2022)
    - climate.climate_multiplier = 1.2088 (LV/PL HDD ratio)
    - tabula source = PL; code/data/raw/tabula/pl_intensities.csv
  needs_verify_summary:
    - retrofit shares (0.90/0.07/0.03) -- modelling assumption; no published
      three-state envelope distribution for Latvia.
    - non_residential_intensity (160) -- estimate; contributes 0 TWh.
    - reconciliation_benchmarks.eu_bso -- anchored estimate, BSO portal not retrievable.
