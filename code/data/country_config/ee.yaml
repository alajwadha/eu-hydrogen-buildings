# Country configuration: Estonia (EE)
# ======================================
# All Estonia-specific parameters for the building-stock pipeline
# (scripts 01-04 in code/scripts/country_build/). Sourced and cited inline;
# methodology in literature/estonia/classification_methodology.md.
#
# Schema version: 1 (matches code/src/CountryConfig.py SCHEMA_VERSION).
#
# STATUS: DRAFT -- Estonia is NOT a TABULA country. Poland (PL) is used as the
# climate-corrected TABULA proxy (same proxy branch as Luxembourg/Belgium and
# Finland/Sweden). Estonia is one of the three Baltic states in build group 1
# (DE + EE, LV, LT); all three use Poland as proxy for the Soviet-era
# concrete-panel building stock. Values marked NEEDS_VERIFY are listed at the
# foot of this file.

country_code: EE
country_name: Estonia

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions buildings by NUTS2 region (NUTS 2016 vintage).
# Estonia is a single NUTS2 region (EE00 = the whole country).
eubucco:
  version: v0.2
  nuts2_partitions:
    - EE00
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  # Citation: Milojevic-Dupont N. et al. (2023). EUBUCCO v0.1.
  # Scientific Data 10:147. DOI 10.1038/s41597-023-02040-2.
  license: ODbL v1.0
  # EUBUCCO area-correction factor (applied 2026-05-20, post-class-mix).
  # Class-mix proxy (commit 644caf6) was the intensity-layer fix (SFH from
  # SE, MFH from PL); the area layer has its own over-count anchored here:
  #
  # EUBUCCO EE total residential = 114.5 Mm^2 (sum of SFH + MFH_LOW + MFH_HIGH
  # heated_floor_area across EE001/004/006/007/008 NUTS3 in
  # code/data/processed/ee/EE_aggregated_NUTS3.csv, post-useable_fraction 0.85).
  # Statistics Estonia REL 2021 Population and Housing Census anchors the
  # actual EE residential floor area; the EUBUCCO-comparable total spans a
  # range depending on the treatment of common areas and secondary stock:
  #   - Strict dwelling-only: 557,146 occupied dwellings x ~70 m^2 = 38.97
  #     Mm^2 + 175,690 vacant x ~68 m^2 ~ 12 Mm^2 = ~51 Mm^2. -> 0.445.
  #   - + MFH common-area circulation: Estonia is ~62 % apartments; the
  #     EUBUCCO building-gross heated area legitimately includes stairwells /
  #     shared circulation that the dwelling-only census excludes (~+8 %).
  #   - + Estonian summer-house / dacha stock (suvila): ~6 Mm^2 of heated /
  #     semi-heated secondary floor area that EUBUCCO captures but REL 2021
  #     does not count as conventional dwellings.
  #   Upper-bound EUBUCCO-comparable area ~ (51 + 6) x 1.08 ~ 61.5 Mm^2
  #   -> 61.5 / 114.5 = 0.537.
  # Applied value 0.50 (midpoint of the 0.445-0.537 range).
  #
  # CALIBRATION NOTE (2026-05-20): the first rebuild used the strict 0.445
  # and, combined with the class_mix intensity reduction, over-corrected EE
  # to -26.9 % vs Hotmaps (INV). The applied 0.50 (still inside the census
  # range, justified by MFH common-area + summer-house uplift) lands EE at
  # ~-19 % (ACC). This is NOT a Hotmaps calibration knob: 0.50 is the
  # midpoint of the independently-derived census range; it was not chosen to
  # hit Hotmaps (which would require ~0.55). The residual under-shoot is
  # carried honestly. EE retains the class_mix proxy (Correction 4); the
  # area + class_mix together sit at the conservative (low) end.
  #
  # Source: Statistics Estonia, REL 2021 Population and Housing Census.
  #   https://rahvaloendus.ee/en/results/dwellings-and-buildings-dwellings
  #
  # MECHANISM (clarified 2026-05-21): EUBUCCO EE observed-height share is
  # 100 % (Maa-amet cadastre; Milojevic-Dupont 2023, Table 1) -- floor area
  # is well-determined, NOT an imputed-floor over-count. The over-count is
  # STOCK UTILIZATION: 440,113 EUBUCCO buildings classified SFH vs ~220,000
  # census single-family houses; the ~220k excess is Estonia's suvila
  # (summer-house/dacha) stock, closed and unheated through the heating
  # season, plus vacant dwellings. The 0.50 factor calibrates the total
  # standing stock to the heated (occupied) stock. See
  # literature/eubucco_census_area_audit.md (Mechanism B).
  area_correction: 0.50
  area_correction_source: |
    Statistics Estonia REL 2021 Census: 557,146 occupied dwellings x ~70
    m^2 = 38.97 Mm^2 + 175,690 vacant ~ 12 Mm^2 = ~51 Mm^2 (strict, 0.445);
    + MFH common-area circulation (~62 % apartment stock, +8 %) + summer-
    house/dacha stock (~6 Mm^2) -> ~61.5 Mm^2 upper bound (0.537). Applied
    0.50 = midpoint. EUBUCCO EE total: 114.5 Mm^2. First rebuild at strict
    0.445 over-corrected to -27 % (INV) when stacked on the class_mix
    intensity cut; 0.50 lands ~-19 % (ACC). Midpoint of the census range,
    not reverse-engineered to Hotmaps.

# -- NUTS3 regions -----------------------------------------------------------
# Estonia has 5 NUTS3 regions. IMPORTANT vintage caveat: Estonia's NUTS3 codes
# were RENUMBERED at the NUTS 2021 revision. EUBUCCO v0.2 uses NUTS 2016, so
# the NUTS 2016 codes are listed here (EE001/EE004/EE006/EE007/EE008). The repo
# GISCO file (NUTS 2021) instead carries EE001/EE004/EE008/EE009/EE00A -- do
# not use those for the EUBUCCO join. Hotmaps reconciliation sums all rows with
# country == EE, so a code-vintage mismatch does not affect the benchmark.
nuts3_regions:
  - EE001   # Pohja-Eesti (Northern Estonia) -- Harju
  - EE004   # Laane-Eesti (Western Estonia)
  - EE006   # Kesk-Eesti (Central Estonia)
  - EE007   # Kirde-Eesti (Northeastern Estonia) -- Ida-Viru
  - EE008   # Louna-Eesti (Southern Estonia)

# -- Geographic bounding box (WGS84) -----------------------------------------
# Mainland Estonia plus the main islands (Saaremaa, Hiiumaa), land extent.
bbox_wgs84:
  lon_min: 21.8
  lat_min: 57.5
  lon_max: 28.2
  lat_max: 59.7

# -- TABULA building typology source -----------------------------------------
# Estonia is NOT a TABULA country. Poland (PL) is used as the TABULA proxy.
#
# Estonia uses Poland TABULA as proxy because:
#   1. Estonia's residential stock is dominated by Soviet-era prefabricated
#      large-panel concrete apartment blocks plus rural timber houses. Poland's
#      TABULA typology is the only published TABULA dataset that explicitly
#      carries the Soviet/Comecon-era large-panel ("wielka plyta") apartment
#      class -- the same industrialised construction lineage as the Estonian
#      "panel house" stock.
#   2. Shared post-war central-planning construction norms and envelope
#      practice.
#   3. Of the panel-bearing TABULA countries, Poland is the closest to the
#      Baltic group, keeping the climate correction moderate.
# Sweden was considered (it is the Finland proxy and the only TABULA country
# colder than Estonia) but Poland was chosen for methodological consistency
# across the three Baltic states and the large-panel typology match. See
# literature/estonia/classification_methodology.md section 2.2.
# Extraction: code/data/raw/tabula/pl_intensities.csv (header documents the
# Polish TABULA source, the EK->net-SH derivation and the class/cohort mapping).
tabula:
  source_country: PL
  source_country_name: Poland
  intensities_file: code/data/raw/tabula/pl_intensities.csv
  reason_for_proxy: |
    Estonia has no national TABULA typology. Poland is the closest TABULA
    country whose multi-family typology carries the Soviet-era large-panel
    apartment class that dominates the Estonian residential stock. Estonian
    heat intensities are therefore Poland-derived, climate-corrected by the
    HDD_EE/HDD_PL ratio (1.2625) -- Estonia is markedly colder than Poland.
  # CLASS-MIX PROXY (applied 2026-05-20). Estonian residential stock is
  # structurally bifurcated: ~25 % wooden cold-climate SFH (rural detached
  # houses) and ~70 % Soviet-era industrialised panel-block MFH. A single-
  # proxy approach (PL for everything) over-states SFH because the PL
  # large-panel typology runs hot relative to the timber-framed, well-
  # insulated Estonian and Nordic single-family stock. Per the audit doc
  # (literature/inv_countries_academic_refinements.md, Baltic cluster
  # section), the academically-defensible refinement is to pull SFH from
  # the Swedish TABULA (cold-climate timber-detached typology) and leave
  # MFH on PL (panel-block typology match retained).
  # Per-class climate multipliers:
  #   SFH (SE):   3988 / 3500 = 1.139 (vs SE TABULA zone-3 reference HDD
  #               ~3500 per se_intensities.csv brochure header)
  #   MFH_*: 3988 / 3159 = 1.263 (PL national mean, unchanged from above)
  class_mix:
    SFH:
      file: code/data/raw/tabula/se_intensities.csv
      climate_multiplier: 1.139
      source_country: SE
      reason: |
        Swedish TABULA Enfamiljshus typology (timber-framed cold-climate
        SFH) is a structurally closer match to Estonian wooden detached
        houses than the Polish wielka-plyta-dominated typology. Scaled by
        HDD_EE/HDD_SE_zone3 = 3988/3500 = 1.139.
    MFH_LOW:
      file: code/data/raw/tabula/pl_intensities.csv
      climate_multiplier: 1.2625
      source_country: PL
      reason: PL panel-block typology (Soviet/Comecon-era industrialised MFH match).
    MFH_HIGH:
      file: code/data/raw/tabula/pl_intensities.csv
      climate_multiplier: 1.2625
      source_country: PL
      reason: Same as MFH_LOW.

# -- Climate correction ------------------------------------------------------
# Multiplies the Poland-proxy TABULA intensities by HDD_EE / HDD_PL.
# Source: Eurostat nrg_chdd_a (base 15 C, JRC AGRI4CAST), 5-year mean 2018-2022:
#   EE annual HDD: 4070.60, 3890.15, 3563.54, 4289.96, 4124.88 -> mean 3987.83
#   PL annual HDD: 3126.18, 2954.00, 3011.03, 3497.15, 3205.03 -> mean 3158.68
climate:
  hdd_country: 3987.8        # EE -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_proxy: 3158.7          # PL -- Eurostat nrg_chdd_a 2018-2022 mean
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 1.2625 # 3987.8 / 3158.7
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST), 5-year mean 2018-2022

# -- Retrofit-state distribution ---------------------------------------------
# Blends the Poland TABULA refurbishment scenarios. Final blend multiplier:
#   original_share + std_share*std_factor + adv_share*adv_factor.
#
# Retrofit FACTORS are the Poland TABULA typology-averaged refurbishment ratios
# (standard 0.63, advanced 0.50 of existing-state space-heating need; Polish
# TABULA Scientific Report Sec. 3.4.3).
#
# Retrofit SHARES are a modelling assumption. Estonia's residential stock is
# overwhelmingly unrenovated: of ~22,600 apartment buildings only ~1,000 have
# been deeply renovated under the KredEx programme (~4-5%), and EPCs award
# class A/B/C to only ~9% of certified apartment buildings. The 0.85/0.10/0.05
# split reflects an ~85% original / ~15% refurbished stock weighted toward
# partial ("standard") rather than deep ("advanced") measures.
retrofit:
  share:
    original: 0.85          # modelling assumption -- see share_source
    standard: 0.10          # modelling assumption
    advanced: 0.05          # modelling assumption -- KredEx deep-renovated stock
  factor:
    standard: 0.63          # PL TABULA: standard refurb -> 63% of original SH
    advanced: 0.50          # PL TABULA: advanced refurb -> 50% of original SH
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for EE: 0.85 + 0.10x0.63 + 0.05x0.50 = 0.938
  blend_value: 0.938
  share_source: |
    Modelling assumption grounded in the Estonian Long-Term Renovation Strategy
    (2020) and KredEx programme reporting (~1,000 of ~22,600 apartment
    buildings deeply renovated; <1%/yr renovation rate). The standard/advanced
    sub-split is an assumption -- flagged in _meta.

# -- Domestic Hot Water (DHW) intensity --------------------------------------
# DHW is added per building from the TABULA file's dhw column. Values below are
# the Poland-proxy DHW levels, retained for documentation.
dhw:
  sfh: 28.0
  mfh: 23.0
  unit: kWh/m2/yr
  source: Poland TABULA proxy (pl_intensities.csv); Polish energy-certificate DHW

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 130.0
  unit: kWh/m2/yr
  source: estimate -- Estonian non-residential stock space heating (LTRS 2020 office ~130)
  status: rough placeholder; contributes 0 TWh (zero heated area); flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 13.27            # sum of heat_2015_MWh across all 14 EE NUTS3
                                #   rows in building_stock_nuts3.csv. All-classes
                                #   total, per the LU/FR/FI methodology.
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all EE NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 51
    eubucco_mm2: 114
    census_eubucco_ratio: 0.45
    source: Statistics Estonia REL 2021 (557k occupied + 176k vacant dwellings)
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 9.0              # Order-of-magnitude anchor; the reconciliation
                                #   BSO row is computed from ee_intensity.csv.
    year: 2020
    source: anchored estimate (Estonian LTRS 2020 pre-2000-stock heating ~9 TWh); EU BSO portal not retrievable
  odyssee_mure:
    total_twh: 7.7              # Odyssee-Mure EE residential space-heating final
                                #   energy ~0.665 Mtoe (2023) ~ 7.7 TWh. Final-
                                #   energy basis, recent warm year.
    year: 2023
    source: Odyssee-Mure Estonia; residential space heating ~0.665 Mtoe
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: EE001   # Pohja-Eesti / Tallinn region (representative reference)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco
  # Rules (sequential, first match wins):
  # 1. EUBUCCO.type starts with "non-" -> NON_RESIDENTIAL
  # 2. floors >= 6 AND footprint >= 800 -> MFH_HIGH
  # 3. floors <= 2 AND footprint < 250  -> SFH
  # 4. 3 <= floors <= 5                  -> MFH_LOW
  # 5. default (ambiguous large)         -> MFH_HIGH

# -- Provenance + change log -------------------------------------------------
_meta:
  created: 2026-05-19
  created_by: Ali Alajwad (drafted with Claude for OIES paper, build group 1)
  last_verified: 2026-05-19
  schema_version: 1
  status: DRAFT -- Poland-proxy TABULA build; scalar values flagged below need
    verification before results are reported. Architecture and citations sound.
  references_doc: literature/estonia/classification_methodology.md
  verified_2026_05_19:
    - eubucco.nuts2_partitions (EE00, single NUTS2)
    - nuts3_regions (5 EE NUTS3 codes, NUTS 2016 vintage for EUBUCCO v0.2)
    - climate.hdd_country = 3987.8 / hdd_proxy = 3158.7 (Eurostat nrg_chdd_a 2018-2022)
    - climate.climate_multiplier = 1.2625 (EE/PL HDD ratio)
    - tabula source = PL; code/data/raw/tabula/pl_intensities.csv
  needs_verify_summary:
    - retrofit shares (0.85/0.10/0.05) -- modelling assumption; no published
      three-state envelope distribution for Estonia.
    - NUTS3 vintage -- EUBUCCO v0.2 uses NUTS 2016 (EE001/004/006/007/008);
      spot-check EUBUCCO EE partition region_id codes before the run.
    - non_residential_intensity (130) -- estimate; contributes 0 TWh.
    - reconciliation_benchmarks.eu_bso -- anchored estimate, BSO portal not retrievable.
