  # NUTS-VINTAGE FIX (2026-05-24): the EUBUCCO v0.2 UK partitions use the
  # NUTS 2016 Scotland recoding (UKM5/6/7/8/9), NOT the older UKM2/UKM3 that
  # the Hotmaps building_stock_nuts3.csv carries. The first group7 run failed
  # at 01_download because UKM2/UKM3 return HTTP 404 from the s3.eubucco.com
  # bucket. Verified against the live bucket listing 2026-05-24: the UK set is
  # exactly these 42 NUTS2 keys (UKM5-9 for Scotland; UKN0 + UKN1 for Northern
  # Ireland). 02_classify uses EUBUCCO's own region_id for NUTS3, so the
  # nuts3_regions list below is documentation only.
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  license: ODbL v1.0
  # NO area_correction in this initial build. UK is a candidate for BOTH a
  # Mechanism-A correction (OSM/Microsoft imputed floors) AND a Mechanism-B
  # occupancy correction (Census 2021 occupied ~93.5pct; vacant + 2nd homes
  # ~6.5pct, largely unheated in the mild UK climate). Per the area policy
  # (literature/eubucco_census_area_audit.md), sized only AFTER the first
  # Colab build reveals the EUBUCCO area + native gap -- not pre-fitted.

