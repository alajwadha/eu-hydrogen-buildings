# Country configuration: United Kingdom (UK)
# ======================================
# All UK-specific parameters for the building-stock pipeline
# (scripts 01-04). Methodology: literature/united_kingdom/classification_methodology.md.
#
# Schema version: 1.
# STATUS: DRAFT -- non-EU (Phase 1F). UK is NOT in TABULA-12 but has rich
# national archetype data (Cambridge Housing Model / English Housing Survey /
# RdSAP). UK-DIRECT typology in uk_intensities.csv; climate_multiplier = 1.0.
# Build group 7 (UK + CH).

country_code: UK
country_name: United Kingdom

# -- EUBUCCO data source -----------------------------------------------------
# COVERAGE: EUBUCCO v0.2 ADDED the UK (v0.1 was EU-27 + CH only, GADM-based --
# do not cite the v0.1 paper for UK coverage). v0.2 partitions by NUTS2 on the
# NUTS 2016 UK-prefixed vintage (UKxxx); the post-Brexit ITL "TLxxx" codes are
# NOT used. UK footprints are OSM + Microsoft-ML sourced (no open national
# building register), so footprints are good but construction_year / type are
# SPARSE -> expect a fallback-dominated (unknown-cohort) result driven by the
# uk_intensity.csv BSO stock weights. Northern Ireland (UKN0) is highest-risk.
