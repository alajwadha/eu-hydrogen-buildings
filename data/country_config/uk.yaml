  lat_max: 60.86

# -- TABULA building typology source -----------------------------------------
tabula:
  source_country: UK
  source_country_name: United Kingdom
  intensities_file: code/data/raw/tabula/uk_intensities.csv
  reason_for_proxy: |
    None -- the UK uses its own national archetype matrix (Cambridge Housing
    Model + English Housing Survey + RdSAP), not a TABULA proxy. The UK is not
    a TABULA-12 participant but its EHS/CHM evidence base is the equivalent
    national typology. climate_multiplier = 1.0 (UK-calibrated).

# -- Climate correction ------------------------------------------------------
# UK mild maritime. Eurostat nrg_chdd_a historically reported the UK; 2018-2022
# mean at base 15 C ~2500 HDD (NEEDS_VERIFY; base 15.5 gives ~2400-2700).
# Direct typology, national-mean calibration -> tabula_reference_hdd =
# hdd_country, climate_multiplier = 1.0.
climate:
  hdd_country: 2500
  hdd_proxy: 2500
  tabula_reference_hdd: 2500
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  climate_multiplier: 1.0
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST) 2018-2022 mean estimate NEEDS_VERIFY

# -- Retrofit-state distribution ---------------------------------------------
# Large PARTIALLY-retrofitted stock: loft + cavity insulation widespread
# (ECO/CERT/CESP), but ~8 M solid-wall homes largely un-insulated. EHS 2022
# EPC: A-C 48pct, D 43pct, E-G 9pct.
retrofit:
  share:
    original: 0.35
    standard: 0.45
    advanced: 0.20
  factor:
    standard: 0.65
    advanced: 0.40
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # 0.35 + 0.45x0.65 + 0.20x0.40 = 0.7225
  blend_value: 0.7225
  share_source: |
    Modelling assumption grounded in EHS 2022-23 EPC distribution (A-C 48pct,
    D 43pct, E-G 9pct) and ECO / Great British Insulation Scheme / Boiler
    Upgrade Scheme history. ~8 M solid-wall homes remain un-insulated.
    Retrofit factors PROVISIONAL (CHM/RdSAP-style).

# -- Domestic Hot Water (DHW) intensity --------------------------------------
dhw:
  sfh: 20.0
  mfh: 23.0
  unit: kWh/m2/yr
  source: SAP/CHM ~3000 kWh/dwelling/yr DHW (occupancy-driven), per-m2 (provisional)

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 120.0
  unit: kWh/m2/yr
  source: estimate -- UK non-residential (tertiary) space heating; mild maritime
  status: rough placeholder; contributes 0 TWh; flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 467.70           # sum of heat_2015_MWh across all 174 UK NUTS3 rows
    year: 2015                  #   in building_stock_nuts3.csv (Hotmaps EU28; verified 2026-05-21)
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all UK NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 2750
    eubucco_mm2: 2933
    census_eubucco_ratio: 0.94
    source: EHS / Dwelling Stock Estimates -- ~29.6 M dwellings x ~93 m2 ~ 2750 Mm2
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). First Colab
      build (2026-05-24): EUBUCCO UK residential heated area = 2933 Mm2, census
      2750 Mm2 -> ratio 0.94 (within 6 %). UK is NOT an area over-count case
      (unlike the imputed-floor cluster), so NO area_correction is applied. The
      bottom-up lands at 368.9 TWh = -21.1 % vs Hotmaps (ACC) -- an
      intensity-layer under-shoot (retrofit blend over-discounting the
      un-retrofitted solid-wall stock; UK is 99.9 % unknown-cohort). Left
      native. See literature/eubucco_census_area_audit.md.
  eu_bso:
    total_twh: 330.0
    year: 2022
    source: anchored estimate (UK residential SH useful demand order-of-magnitude)
  odyssee_mure:
    total_twh: 330.0
    year: 2021
    source: UK national statistics (DESNZ ECUK); residential space heating ~330 TWh
    note: National total only; definitional gap vs Hotmaps useful demand.

# -- Hotmaps NUTS3 ID for model comparison -----------------------------------
hotmaps_nuts3_id: UKI31   # Greater London (representative)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco

