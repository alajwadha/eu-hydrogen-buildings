# Country configuration: Austria (AT)
# =====================================
# All Austria-specific parameters for the building-stock pipeline.
# Methodology: literature/austria/classification_methodology.md.
#
# Schema version: 1.
# Austria is a DIRECT TABULA country (AEA / Austrian Energy Agency; Lechner
# et al. 2011). Build group 5 (AT + BE, NL, IE; NW temperate Europe). Hotmaps
# 2015 baseline ~72 TWh.

country_code: AT
country_name: Austria

# -- EUBUCCO data source -----------------------------------------------------
# EUBUCCO v0.2 partitions by NUTS2 (NUTS 2016). Austria has 9 NUTS2 regions
# (AT11-AT34); stable across NUTS 2013/2016/2021.
eubucco:
  version: v0.2
  nuts2_partitions:
    - AT11   # Burgenland
    - AT12   # Niederosterreich
    - AT13   # Wien (Vienna)
    - AT21   # Karnten
    - AT22   # Steiermark
    - AT31   # Oberosterreich
    - AT32   # Salzburg
    - AT33   # Tirol
    - AT34   # Vorarlberg
  base_url: https://s3.eubucco.com/eubucco/v0.2/buildings/parquet
  license: ODbL v1.0
  # EUBUCCO area-correction factor (applied 2026-05-20).
  # Initial G5 Colab build landed AT at 125.5 TWh vs Hotmaps 82.36 = +52.4 %
  # INV. AT BU also matched the BSO benchmark (~109 TWh) within ~15 %, which
  # suggested an EUBUCCO area over-count rather than an intensity issue
  # (typology is AT-direct, so no proxy mismatch to blame).
  #
  # EUBUCCO AT total residential heated_floor_area = 820 Mm^2 (sum across
  # 9 NUTS2 regions in code/data/processed/at/AT_aggregated_NUTS3.csv,
  # post-useable_fraction 0.85). Statistik Austria GWZ 2021 (Gebaude- und
  # Wohnungszahlung Census, reference date 2021-10-31) anchors the actual
  # AT residential floor area at:
  #   4.9 M dwellings x 96.2 m^2 weighted-mean useful area (Nutzflache)
  #   = 471 Mm^2 occupied + main-residence + secondary stock.
  # Correction = 471 / 820 = 0.574 ~ 0.575.
  #
  # The EUBUCCO over-count is concentrated in MFH_LOW unknown-cohort
  # (432 Mm^2 of the 820 total). Likely driver: EUBUCCO classifies
  # multi-storey rural / mixed-use ground-floor buildings as MFH_LOW
  # whose upper-floor residential portion is a fraction of total
  # footprint x floors. AT GWZ Nutzflache is dwelling-only and excludes
  # commercial ground-floor, stairwells, attics-not-converted.
  #
  # Source: Statistik Austria, Gebaude- und Wohnungszahlung 2021.
  #   https://www.statistik.at/en/statistics/population-and-society/housing/stock-of-dwellings
  # MECHANISM (clarified 2026-05-21): imputed-floor area over-count.
  # EUBUCCO AT observed-height share is 7% (Milojevic-Dupont 2023,
  # Table 1); floors -- hence floor area -- are ML-imputed even though the
  # footprints are cadastre-sourced. The correction calibrates the imputed
  # area to the census. See literature/eubucco_census_area_audit.md
  # (Mechanism A).
  area_correction: 0.575
  area_correction_source: |
    Statistik Austria GWZ 2021 (Gebaude- und Wohnungszahlung Census,
    reference 2021-10-31): 4.9 M dwellings x 96.2 m^2 weighted-mean
    Nutzflache = 471 Mm^2. EUBUCCO AT total: 820 Mm^2 (post-useable_
    fraction 0.85). Correction = 471/820 = 0.574. AT-direct TABULA
    typology was correct; the +52 % G5 gap was an area-layer over-count.

