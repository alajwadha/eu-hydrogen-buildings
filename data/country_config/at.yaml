# -- TABULA building typology source -----------------------------------------
tabula:
  source_country: AT
  source_country_name: Austria
  intensities_file: code/data/raw/tabula/at_intensities.csv
  reason_for_proxy: |
    None -- Austria is a TABULA country. The Austrian national residential
    typology (AEA / Austrian Energy Agency; Lechner, Tappeiner, Lang 2011)
    is used directly, no proxy, no climate correction (climate_multiplier
    = 1.0). The AEA brochure is built from the ZEUS EPC database (~40,000
    certificates) on a national-mean calibration, so the TABULA reference
    HDD coincides with the country's actual HDD.

# -- Climate correction ------------------------------------------------------
# Direct TABULA country with national-mean calibration; multiplier = 1.0.
climate:
  hdd_country: 3050.0        # AT -- Eurostat nrg_chdd_a 2018-2022 mean estimate
  hdd_proxy: 3050.0          # AT direct typology -> proxy = self
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  tabula_reference_hdd: 3050.0  # AEA ZEUS national-mean calibration
  climate_multiplier: 1.0
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST); 5-year mean 2018-2022 estimated NEEDS_VERIFY

# -- Retrofit-state distribution ---------------------------------------------
# Austria has run thermal-renovation programmes consistently since the 1990s;
# Sanierungsoffensive ramped post-2010 and again post-2020 (Raus-aus-Oel-Bonus
# 2019+, ~52,652 applications by Dec 2024). IIBW + Umweltbundesamt monitoring
# puts the measured renovation rate at ~1.5 %/yr. Shares below reflect Austria
# having a higher renovated stock share than DE/CZ at comparable cohort age.
retrofit:
  share:
    original: 0.65          # IIBW + UBA renovation monitoring; mid-DE-CZ
    standard: 0.27          # Sanierungsoffensive standard package
    advanced: 0.08          # Sanierungsoffensive deep / Passivhaus track
  factor:
    standard: 0.65          # AT TABULA standard refurb (provisional)
    advanced: 0.40          # AT TABULA advanced refurb (provisional)
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed blend for AT: 0.65 + 0.27x0.65 + 0.08x0.40 = 0.8575
  blend_value: 0.8575
  share_source: |
    Modelling assumption grounded in IIBW + Umweltbundesamt renovation-rate
    monitoring (~1.5%/yr thermal-only). Sanierungsoffensive (federal, ~360M
    EUR/yr 2026-2030), Sanierungsbonus, Raus-aus-Oel-Bonus (52,652 applications
    by Dec 2024), Wohnbauforderung (Lander-funded). Retrofit factors PROVISIONAL.

# -- Domestic Hot Water (DHW) intensity --------------------------------------
dhw:
  sfh: 10.0
  mfh: 15.0
  unit: kWh/m2/yr
  source: AT TABULA / OIB Richtlinie 6 reference DHW (provisional)

# -- Non-residential intensity (placeholder) ---------------------------------
non_residential_intensity:
  value: 120.0
  unit: kWh/m2/yr
  source: estimate -- Austrian non-residential continental-Alpine space heating
  status: rough placeholder; contributes 0 TWh; flagged in methodology

# -- External reconciliation benchmarks --------------------------------------
reconciliation_benchmarks:
  hotmaps:
    total_twh: 82.36            # Hotmaps 2015 AT residential heat -- exact sum
                                # across all 108 AT NUTS3 rows in
                                # code/data/processed/building_stock_nuts3.csv (verified 2026-05-20).
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all AT NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 471
    eubucco_mm2: 820
    census_eubucco_ratio: 0.57
    source: Statistik Austria GWZ 2021 (4.9M dwellings x 96.2 m2 Nutzflache)
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 60.0
    year: 2022
    source: anchored estimate; EU BSO portal not retrievable
  odyssee_mure:
    total_twh: 52.4
    year: 2023
    source: Odyssee-Mure Austria; residential space heating ~4.5 Mtoe climate-corrected
    note: National total only; final-energy basis -- definitional gap vs Hotmaps useful demand.

hotmaps_nuts3_id: AT130   # Wien (Vienna, representative reference)

# -- Building classification rules -------------------------------------------
classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco

