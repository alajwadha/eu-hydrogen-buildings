    contrary to the original v0.2-NL-no-cohort assumption.
  references_doc: literature/netherlands/classification_methodology.md
  verified_2026_05_20:
    - eubucco.nuts2_partitions (12 NL NUTS2, stable across NUTS vintages)
    - nuts3_regions (40 NL COROP NUTS3, stable)
    - tabula source = NL direct (Voorbeeldwoningen 2011/2022)
    - tabula_reference_hdd = 2900 (KNMI De Bilt 1971-2000 normal)
    - climate_multiplier = 0.8534 (2475 / 2900)
    - construction_year availability in EUBUCCO NL: 100pct (BAG bouwjaar)
  needs_verify_summary:
    - HDD 2018-2022 mean -- estimated; pull exact Eurostat nrg_chdd_a.
    - nl_intensities.csv -- research-synthesised; verify Voorbeeldwoningen.
    - retrofit factors (0.65/0.30) and DHW (17/20) -- PROVISIONAL.
    - retrofit shares (0.55/0.35/0.10) -- aggressive per CBS; verify.
    - Hotmaps total (115) -- estimate; sum building_stock_nuts3.csv.
    - EUBUCCO type field missing for NL (BAG `gebruiksdoel` not ingested);
      residential filter may need post-hoc re-join against raw BAG.
