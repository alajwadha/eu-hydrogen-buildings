tabula:
  source_country: NL
  source_country_name: Netherlands
  intensities_file: code/data/raw/tabula/nl_intensities.csv
  reason_for_proxy: |
    None -- Netherlands is a TABULA country (TNO / Agentschap NL / RVO).
    Voorbeeldwoningen 2011 + 2022 update is the national typology. Option B
    reference-HDD correction applied (KNMI De Bilt ~2900 HDD reference vs
    national 2018-2022 mean ~2475 HDD).

climate:
  hdd_country: 2475.0
  hdd_proxy: 2475.0
  hdd_units: degree-days/yr
  hdd_reference_period: 2018-2022
  hdd_base_temperature_c: 15
  tabula_reference_hdd: 2900.0   # KNMI De Bilt 1971-2000 normal
  climate_multiplier: 0.8534     # 2475 / 2900
  source: Eurostat nrg_chdd_a (JRC AGRI4CAST); 5-year mean 2018-2022 estimate NEEDS_VERIFY

# NL is the most-retrofitted EU residential stock (40 pct of dwellings with
# energy label have A+; 86 pct roof-insulated; 85 pct double-glazed).
# Aggressive ISDE + aardgasvrije wijken + Nationaal Isolatieprogramma.
retrofit:
  share:
    original: 0.55
    standard: 0.35
    advanced: 0.10
  factor:
    standard: 0.65    # NL TABULA "usual" ~35 pct reduction (provisional)
    advanced: 0.30    # NL TABULA "advanced" ~70 pct reduction (provisional)
  blend_formula: original + standard*factor.standard + advanced*factor.advanced
  # Computed: 0.55 + 0.35x0.65 + 0.10x0.30 = 0.8075
  blend_value: 0.8075
  share_source: |
    Modelling assumption grounded in CBS energy-label statistics (Feb 2026:
    ~40 pct of NL dwellings carry label A or higher), Nationaal Isolatie-
    programma (post-2019 Klimaatakkoord) cumulative penetration, ISDE
    heat-pump + insulation subsidy uptake. Retrofit factors PROVISIONAL.

dhw:
  sfh: 17.0
  mfh: 20.0
  unit: kWh/m2/yr
  source: NL Voorbeeldwoningen 2022 (RVO) DHW assumption (provisional)

non_residential_intensity:
  value: 130.0
  unit: kWh/m2/yr
  source: estimate -- NL non-residential (tertiary) space heating; Hotmaps + RVO EP-online
  status: rough placeholder

reconciliation_benchmarks:
  hotmaps:
    total_twh: 160.65           # Hotmaps 2015 NL residential heat -- exact sum
                                # across all 109 NL NUTS3 rows in
                                # code/data/processed/building_stock_nuts3.csv (verified 2026-05-20).
    year: 2015
    source: Hotmaps Toolbox via building_stock_nuts3.csv; sum across all NL NUTS3 rows
    url: hotmaps-project.eu
  census_floor_area:
    total_mm2: 1000
    eubucco_mm2: 982
    census_eubucco_ratio: 1.02
    source: CBS dwelling stock (82550NED; EUBUCCO ~matches, no over-count)
    note: |
      Independent floor-area benchmark (NOT a demand benchmark). National-
      census conventional-dwelling floor area vs EUBUCCO residential heated
      area. See literature/eubucco_census_area_audit.md for the 27-country
      audit and the area-correction policy.
  eu_bso:
    total_twh: 100.0
    year: 2022
    source: anchored estimate
  odyssee_mure:
    total_twh: 95.0
    year: 2022
    source: Odyssee-Mure NL; residential heating ~85pct gas pre-2020, declining 3-4pct/yr
    note: National total only; final-energy basis.

hotmaps_nuts3_id: NL310   # Utrecht (representative)

classification:
  floor_height_residential_m: 3.0
  floor_height_other_m: 3.5
  useable_area_fraction: 0.85
  floor_source: eubucco

_meta:
